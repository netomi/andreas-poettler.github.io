# Preview deployment of the static site to GitHub Pages.
# Lessons are booked via an embedded Cal.com calendar, book orders go to Web3Forms (form-to-email).
# Both are configured with repository variables (Settings > Secrets and variables > Actions > Variables);
# while a variable is empty the feature is shown but disabled.
name: Deploy preview to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Preview on github.io until the repo variable CUSTOM_DOMAIN (e.g. andreas-poettler.at) is set; then build for the custom domain.
      SITE_URL: ${{ vars.CUSTOM_DOMAIN && format('https://{0}', vars.CUSTOM_DOMAIN) || 'https://netomi.github.io' }}
      BASE_PATH: ${{ vars.CUSTOM_DOMAIN && '/' || '/andreas-poettler.github.io' }}
      PUBLIC_CAL_LINK: ${{ vars.PUBLIC_CAL_LINK }}   # e.g. andreas-poettler/probestunde
      PUBLIC_FORM_KEY: ${{ vars.PUBLIC_FORM_KEY }}   # Web3Forms access key (public by design)
      PUBLIC_ORDERS: ${{ vars.PUBLIC_ORDERS }}       # "off" = order form visible but disabled (e.g. while books are placeholders)
      PUBLIC_PREVIEW: ${{ vars.CUSTOM_DOMAIN && 'false' || 'true' }}   # noindex while on the preview URL
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
